# Typecheck, unit tests and the app end to end on Windows and macOS, so a change made on one
# platform cannot quietly break the other. The recorder's tests use its test backend (ffmpeg test
# sources), which runs on both; the platform tests (DXGI and Win32 on Windows, CoreGraphics on
# macOS) run on their own runner. Linux, which only renders, has a job of its own.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # the version from package.json's packageManager
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Gyan's full build (what winget installs), checked against its digest; Chocolatey's feed
      # failed on GitHub's runners
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.7z'
          Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-full_build.7z' -OutFile $archive
          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($digest -ne 'f0e46253c70dfe902bac915dfb4224f0cf1b7c6eeab9da2ccc9a5581f9a71b13') { throw "ffmpeg's archive has another digest: $digest" }
          7z x $archive "-o$env:RUNNER_TEMP" -y | Out-Null
          $bin = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0.2-full_build\bin'
          & (Join-Path $bin 'ffmpeg.exe') -hide_banner -version | Select-Object -First 1
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # ffmpeg-full: Homebrew's ffmpeg has no drawtext, which the OCR checks draw their screens' text with
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"

      # on macOS also builds the screen capture helper with Xcode's Swift
      - run: pnpm install --frozen-lockfile

      # Electron's binary comes on the first require('electron'), not with the install: fetched here, so
      # no check's time limit pays for the download (on a slow runner it took over a minute)
      - run: node -e "console.log(require('electron'))"

      - run: pnpm typecheck

      # one retry: a few recorder tests time real captures, which a busy runner can stretch
      - run: pnpm exec vitest run --project node --retry 1

  # The app end to end, its windows hidden (pnpm app:check): the editor, the pickers, the HUD, the
  # settings and the exports, with the recorder's test backend. A change to the UI made on one
  # platform shows here when it breaks the other.
  app:
    name: app ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # Gyan's full build (what winget installs), checked against its digest; Chocolatey's feed
      # failed on GitHub's runners
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg.7z'
          Invoke-WebRequest -Uri 'https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-full_build.7z' -OutFile $archive
          $digest = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLower()
          if ($digest -ne 'f0e46253c70dfe902bac915dfb4224f0cf1b7c6eeab9da2ccc9a5581f9a71b13') { throw "ffmpeg's archive has another digest: $digest" }
          7z x $archive "-o$env:RUNNER_TEMP" -y | Out-Null
          $bin = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0.2-full_build\bin'
          & (Join-Path $bin 'ffmpeg.exe') -hide_banner -version | Select-Object -First 1
          $bin | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      # ffmpeg-full: Homebrew's ffmpeg has no drawtext, which the OCR checks draw their screens' text with
      - name: ffmpeg (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg-full
          echo "$(brew --prefix ffmpeg-full)/bin" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile

      # Electron's binary comes on the first require('electron'), not with the install: fetched here, so
      # no check's time limit pays for the download (on a slow runner it took over a minute)
      - run: node -e "console.log(require('electron'))"

      - run: pnpm app:check

  # Linux renders only (no recording, no app): the CLI's renders, previews and checks in a virtual
  # display, and the engine's goldens, all with Chromium's software GL
  linux:
    name: ubuntu-latest
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      # the packages the step below downloads, kept between runs (a newer one is downloaded anew)
      - uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: apt-${{ runner.os }}-

      # ffmpeg, a display for Electron (Xvfb), and the libraries Electron's Chromium loads (the image
      # has all but ffmpeg). Its 70 MB came from Azure's mirror at a crawl now and then (10 to 38
      # minutes): kept between runs, and a try that takes over 4 minutes starts again. The runner's
      # own updates are stopped first, and man-db keeps its index.
      - timeout-minutes: 15
        run: |
          sudo systemctl stop unattended-upgrades.service apt-daily.service apt-daily-upgrade.service apt-daily.timer apt-daily-upgrade.timer 2>/dev/null || true
          sudo rm -f /var/lib/man-db/auto-update
          mkdir -p ~/apt-archives/partial
          apt=(sudo apt-get -o DPkg::Lock::Timeout=300 -o Acquire::Retries=5 -o Acquire::http::Timeout=30 -o Dir::Cache::Archives="$HOME/apt-archives")
          "${apt[@]}" -q update
          for try in 1 2 3; do
            if timeout 240 "${apt[@]}" -q install -y --no-install-recommends ffmpeg xvfb xauth libnss3 libatk1.0-0t64 libatk-bridge2.0-0t64 libcups2t64 libgtk-3-0t64 libgbm1 libasound2t64 libxss1 libxshmfence1 libdrm2 fonts-noto-color-emoji; then break; fi
            echo "::warning::apt's try $try took too long or failed: again"
            sudo dpkg --configure -a || true
          done
          command -v ffmpeg
          sudo chown -R "$USER" ~/apt-archives

      - run: pnpm install --frozen-lockfile

      - run: node -e "console.log(require('electron'))"

      - run: pnpm typecheck

      - run: pnpm exec vitest run --project node --retry 1

      - run: xvfb-run -a pnpm cli:check

      # its libraries are the image's and the ones above
      - run: pnpm exec playwright install chromium

      - run: pnpm exec vitest run --project browser

  # The Docker image, and a video of the kit's templates rendered in it
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - run: docker build -t cuttle .

      - name: a video rendered in the image
        run: |
          work="$RUNNER_TEMP/docker"
          mkdir -p "$work"
          cuttle() { timeout 300 docker run --rm --init -v "$work:/work" cuttle "$@"; }
          cuttle init /work/reel
          cuttle -C /work/reel motion new title --first
          cuttle -C /work/reel motion new end-card
          cuttle -C /work/reel --json render
          probe="$(docker run --rm --entrypoint ffprobe -v "$work:/work" cuttle -v error -select_streams v -show_entries stream=codec_name,width,height -of csv=p=0 /work/reel/out/export.mp4)"
          echo "$probe"
          test "$probe" = "h264,1920,1080"
