<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Burn</title>
    <!-- A transition: the outgoing frame burns away like paper, its edge charred dark with a
         glow running ahead of it, and the incoming frame lies beneath. A falling rush goes with
         it (the "sounds" param). -->
    <script type="application/json" id="cuttle-params">
      [
        { "name": "color", "label": "Glow (empty: orange)", "type": "color", "default": "" },
        { "name": "scale", "label": "Size of the burnt shapes (more: smaller)", "type": "number", "default": 3, "min": 1, "max": 10 },
        { "name": "sounds", "label": "Sounds", "type": "bool", "default": true }
      ]
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import { shader } from 'cuttle/shader';

      const { params, duration } = cuttle;
      const number = (value, fallback, min, max) => Math.min(max, Math.max(min, Number.isFinite(Number(value)) && value !== '' ? Number(value) : fallback));

      if (params.sounds !== false) cuttle.sound('downlifter', { at: duration * 0.2, volume: 0.4 });

      shader(
        /* glsl */ `
        vec4 effect(vec2 uv) {
          float n = fbm(uv * vec2(aspect, 1.0) * scale);
          // the burnt edge sweeps past every value of the noise
          float p = progress * 1.3 - 0.15;
          float left = smoothstep(p - 0.01, p + 0.01, n);
          float charred = 1.0 - smoothstep(p, p + 0.08, n);
          vec3 old = mix(fromColor(uv).rgb, vec3(0.05, 0.03, 0.02), charred * 0.85);
          vec3 color = mix(toColor(uv).rgb, old, left);
          color += tint * exp(-abs(n - p) * 60.0) * 1.5 * step(0.001, progress) * step(progress, 0.999);
          return vec4(color, 1.0);
        }
        `,
        { uniforms: { tint: params.color || '#ff7a1a', scale: number(params.scale, 3, 1, 10) } },
      );
    </script>
  </body>
</html>
