<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Push</title>
    <!-- A transition: the incoming frame slides in and pushes the outgoing one out the other
         side, which sinks back a little and darkens under the soft shadow of the new one's
         edge. A swoosh lands with it (the "sounds" param). -->
    <script type="application/json" id="cuttle-params">
      [
        { "name": "direction", "label": "Moves towards", "type": "select", "default": "left", "options": ["left", "right", "up", "down"] },
        { "name": "depth", "label": "How far the old frame sinks back", "type": "number", "default": 0.08, "min": 0, "max": 0.3 },
        { "name": "sounds", "label": "Sounds", "type": "bool", "default": true }
      ]
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import { shader } from 'cuttle/shader';

      const { params, duration } = cuttle;
      const number = (value, fallback, min, max) => Math.min(max, Math.max(min, Number.isFinite(Number(value)) && value !== '' ? Number(value) : fallback));
      const towards = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[params.direction] ?? [-1, 0];
      if (params.sounds !== false) cuttle.sound('swoosh-in', { at: duration * 0.65, volume: 0.45 });

      shader(
        /* glsl */ `
        vec4 effect(vec2 uv) {
          float p = inOutQuart(progress);
          // the incoming frame: in from the far side, along the way it moves
          vec2 incoming = uv - towards * (p - 1.0);
          if (all(greaterThanEqual(incoming, vec2(0.0))) && all(lessThanEqual(incoming, vec2(1.0)))) return vec4(toColor(incoming).rgb, 1.0);
          // the outgoing one: pushed half as far, smaller and darker, in the shadow of the edge
          vec2 outgoing = (uv - towards * p * 0.5 - 0.5) / (1.0 - depth * p) + 0.5;
          float edge = dot(uv - 0.5, -towards) + 0.5 - (1.0 - p) * 1.0;
          float shade = (1.0 - 0.35 * p) * (1.0 - 0.45 * exp(-max(0.0, -edge) * 18.0) * step(0.001, p));
          vec3 color = all(greaterThanEqual(outgoing, vec2(0.0))) && all(lessThanEqual(outgoing, vec2(1.0))) ? fromColor(outgoing).rgb : vec3(0.0);
          return vec4(color * shade, 1.0);
        }
        `,
        { uniforms: { towards, depth: number(params.depth, 0.08, 0, 0.3) } },
      );
    </script>
  </body>
</html>
