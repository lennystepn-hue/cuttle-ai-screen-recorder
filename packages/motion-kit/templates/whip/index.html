<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Whip pan</title>
    <!-- A transition: a fast camera pan, the outgoing frame smeared along the way it flies out
         and the incoming one smeared as it flies in, sharpest where the move is slowest. A
         whoosh peaks in the middle (the "sounds" param). -->
    <script type="application/json" id="cuttle-params">
      [
        { "name": "direction", "label": "Moves towards", "type": "select", "default": "left", "options": ["left", "right", "up", "down"] },
        { "name": "blur", "label": "Smear", "type": "number", "default": 0.7, "min": 0, "max": 1.5 },
        { "name": "sounds", "label": "Sounds", "type": "bool", "default": true }
      ]
    </script>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #000;
      }
    </style>
  </head>
  <body>
    <script type="module">
      import { shader } from 'cuttle/shader';

      const { params, duration } = cuttle;
      const number = (value, fallback, min, max) => Math.min(max, Math.max(min, Number.isFinite(Number(value)) && value !== '' ? Number(value) : fallback));
      const towards = { left: [-1, 0], right: [1, 0], up: [0, -1], down: [0, 1] }[params.direction] ?? [-1, 0];
      if (params.sounds !== false) cuttle.sound('whoosh', { at: duration * 0.5, volume: 0.6 });

      shader(
        /* glsl */ `
        // the strip the picture moves along: the outgoing frame, the incoming one beside it where it comes from
        vec3 strip(vec2 s) {
          return all(greaterThanEqual(s, vec2(0.0))) && all(lessThanEqual(s, vec2(1.0))) ? fromColor(s).rgb : toColor(s + towards).rgb;
        }

        vec4 effect(vec2 uv) {
          float p = inOutQuart(progress);
          // its speed, 1 at the fastest (in the middle)
          float speed = (progress < 0.5 ? 32.0 * pow(progress, 3.0) : 4.0 * pow(2.0 - 2.0 * progress, 3.0)) / 4.0;
          vec3 sum = vec3(0.0);
          for (int i = 0; i < 24; i++) {
            float o = p + (float(i) / 23.0 - 0.5) * blur * 0.3 * speed;
            sum += strip(uv - towards * o);
          }
          return vec4(sum / 24.0, 1.0);
        }
        `,
        { uniforms: { towards, blur: number(params.blur, 0.7, 0, 1.5) } },
      );
    </script>
  </body>
</html>
