packages:
  - packages/*
  - apps/*
  - skill
allowBuilds:
  # its install script, should a version bring one back: since Electron 44 the binary comes on the
  # first require('electron') instead (checked against its checksums)
  electron: true
  # electron-builder's Squirrel installer, which Cuttle does not build (its installer is NSIS)
  electron-winstaller: false
  koffi: false
  uiohook-napi: false
